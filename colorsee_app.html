<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ColorSee</title>
    <meta name="theme-color" content="#0f0f0f">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: rgba(30, 30, 30, 0.90);
            --accent: #00ff9d;
            --text-main: #ffffff;
            --font-stack: 'Inter', system-ui, -apple-system, sans-serif;
            --glass: blur(12px) saturate(180%);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg);
            font-family: var(--font-stack);
            overflow: hidden;
            color: var(--text-main);
        }

        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #source-video, #source-image {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            display: none;
            z-index: 1;
        }

        #output-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .ui-layer {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            padding: 15px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            text-align: center;
            pointer-events: auto;
        }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; }
        h1 span { color: var(--accent); }

        .controls {
            padding: 15px;
            background: var(--surface);
            backdrop-filter: var(--glass);
            -webkit-backdrop-filter: var(--glass);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.7);
        }

        .control-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* COMPACT BUTTON STYLES */
        button, .file-upload-label, .btn-link {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 10px 12px; /* Reverted to smaller padding */
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1;
            text-align: center;
            user-select: none;
            text-decoration: none;
            appearance: none;
            -webkit-appearance: none;
            line-height: 1.2;
        }

        button:active, .file-upload-label:active, .btn-link:active { 
            transform: scale(0.96); 
            background: rgba(255,255,255,0.2);
        }
        
        button.primary {
            background: var(--accent);
            color: #000;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 255, 157, 0.3);
            font-size: 0.95rem;
            padding: 12px;
        }

        /* Toggle */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444;
            transition: .3s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Support Buttons Container */
        .support-area {
            margin-top: 5px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        /* Specific Button Colors */
        .cash-app {
            background: #00D632 !important;
            color: white !important;
            border: none;
        }
        .share-btn {
            background: #2D9CDB !important;
            color: white !important;
            border: none;
        }

        input[type="file"] { display: none; }
        .hidden { display: none !important; }
        
        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
            opacity: 1;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            display: none; /* Force layout removal */
        }
        .modal-card {
            background: #1a1a1a; padding: 30px; border-radius: 20px; text-align: center; max-width: 85%; width: 350px;
            border: 1px solid #333;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            width: 90%;
            max-width: 350px;
        }
        .toast {
            background: rgba(30, 30, 30, 0.95);
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            border-left: 4px solid var(--accent);
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            font-size: 0.9rem;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .toast.visible { opacity: 1; transform: translateY(0); }
        .toast.error { border-left-color: #ff4757; }
    </style>
</head>
<body>

    <div id="app-container">
        <video id="source-video" autoplay playsinline muted></video>
        <img id="source-image" alt="Uploaded source">
        <canvas id="output-canvas"></canvas>

        <div class="ui-layer">
            <header>
                <h1>Color<span>See</span></h1>
            </header>

            <div class="controls">
                <div class="toggle-container">
                    <span>Show Labels</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-overlay" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="control-row">
                    <button id="btn-camera" class="primary">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        Live Cam
                    </button>
                    <label class="file-upload-label">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        Upload
                        <input type="file" id="inp-file" accept="image/*">
                    </label>
                </div>

                <div class="support-area">
                    <!-- Direct Link for reliability -->
                    <a href="https://cash.app/$unixarcade" target="_blank" class="btn-link cash-app">
                        Support $unixarcade
                    </a>
                    <button class="share-btn" id="btn-share">
                        Share App
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Start Modal -->
    <div id="start-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 class="text-2xl font-bold mb-4 text-white">ColorSee</h2>
            <p class="text-gray-300 mb-6 text-sm leading-relaxed">Tap Start to enable camera permissions.</p>
            <button class="primary w-full justify-center text-base" id="btn-start-experience">Start Experience</button>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script>
        const CONFIG = {
            gridSize: 80, 
            font: '600 14px Inter, sans-serif',
            updateInterval: 60
        };

        const STATE = {
            mode: 'idle',
            overlayEnabled: true,
            lastFrameTime: 0,
            stream: null
        };

        const PALETTE = [
            {name: "Black", r:0, g:0, b:0}, {name: "White", r:255, g:255, b:255},
            {name: "Red", r:255, g:0, b:0}, {name: "Lime", r:0, g:255, b:0},
            {name: "Blue", r:0, g:0, b:255}, {name: "Yellow", r:255, g:255, b:0},
            {name: "Cyan", r:0, g:255, b:255}, {name: "Magenta", r:255, g:0, b:255},
            {name: "Silver", r:192, g:192, b:192}, {name: "Gray", r:128, g:128, b:128},
            {name: "Maroon", r:128, g:0, b:0}, {name: "Olive", r:128, g:128, b:0},
            {name: "Green", r:0, g:128, b:0}, {name: "Purple", r:128, g:0, b:128},
            {name: "Teal", r:0, g:128, b:128}, {name: "Navy", r:0, g:0, b:128},
            {name: "Orange", r:255, g:165, b:0}, {name: "Gold", r:255, g:215, b:0},
            {name: "Pink", r:255, g:192, b:203}, {name: "Brown", r:165, g:42, b:42},
            {name: "Beige", r:245, g:245, b:220}, {name: "Violet", r:238, g:130, b:238},
            {name: "Indigo", r:75, g:0, b:130}
        ];

        const elVideo = document.getElementById('source-video');
        const elImg = document.getElementById('source-image');
        const elCanvas = document.getElementById('output-canvas');
        const ctx = elCanvas.getContext('2d', { alpha: true });
        const elToggle = document.getElementById('toggle-overlay');
        const toastContainer = document.getElementById('toast-container');

        // --- Low Level Utils ---

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            toastContainer.appendChild(toast);
            void toast.offsetWidth; 
            requestAnimationFrame(() => toast.classList.add('visible'));
            setTimeout(() => {
                toast.classList.remove('visible');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function getColorName(r, g, b) {
            let minDist = Infinity;
            let match = "Unknown";
            for (let i = 0; i < PALETTE.length; i++) {
                const c = PALETTE[i];
                const dist = (r - c.r)**2 + (g - c.g)**2 + (b - c.b)**2;
                if (dist < minDist) {
                    minDist = dist;
                    match = c.name;
                }
            }
            return match;
        }

        function drawOverlay(sourceElement) {
            if (!STATE.overlayEnabled) {
                ctx.clearRect(0, 0, elCanvas.width, elCanvas.height);
                return;
            }

            const w = sourceElement.videoWidth || sourceElement.naturalWidth;
            const h = sourceElement.videoHeight || sourceElement.naturalHeight;
            
            if (elCanvas.width !== w || elCanvas.height !== h) {
                elCanvas.width = w;
                elCanvas.height = h;
            }

            ctx.drawImage(sourceElement, 0, 0, w, h);
            const frameData = ctx.getImageData(0, 0, w, h);
            const data = frameData.data;
            ctx.clearRect(0, 0, w, h);

            ctx.font = CONFIG.font;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "black";
            ctx.shadowBlur = 4;
            ctx.fillStyle = "white";

            for (let y = CONFIG.gridSize / 2; y < h; y += CONFIG.gridSize) {
                for (let x = CONFIG.gridSize / 2; x < w; x += CONFIG.gridSize) {
                    const i = (Math.floor(y) * w + Math.floor(x)) * 4;
                    if (i < data.length) {
                        const r = data[i];
                        const g = data[i+1];
                        const b = data[i+2];
                        const colorName = getColorName(r, g, b);

                        ctx.fillText(colorName, x, y);
                        ctx.beginPath();
                        ctx.arc(x, y + 15, 4, 0, 6.28);
                        ctx.fillStyle = `rgb(${r},${g},${b})`;
                        ctx.fill();
                        ctx.strokeStyle = "white";
                        ctx.lineWidth = 1;
                        ctx.stroke();
                        ctx.fillStyle = "white"; 
                    }
                }
            }
        }

        function loop(timestamp) {
            if (STATE.mode === 'camera') {
                if (timestamp - STATE.lastFrameTime > CONFIG.updateInterval) {
                    drawOverlay(elVideo);
                    STATE.lastFrameTime = timestamp;
                }
                requestAnimationFrame(loop);
            }
        }

        // --- Core ---

        async function startCamera() {
            if (STATE.stream) {
                STATE.stream.getTracks().forEach(track => track.stop());
            }

            STATE.mode = 'camera';
            elImg.style.display = 'none';
            elVideo.style.display = 'block';

            try {
                // IMPORTANT: We do not wait for metadata here to block execution.
                // We ask for permission, then handle the video flow.
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" },
                    audio: false
                });
                
                STATE.stream = stream;
                elVideo.srcObject = stream;
                elVideo.play(); // Explicit play

                // Wait for video dimensions before drawing
                elVideo.onloadedmetadata = () => {
                    elCanvas.width = elVideo.videoWidth;
                    elCanvas.height = elVideo.videoHeight;
                    requestAnimationFrame(loop);
                    showToast("Camera Active");
                };

            } catch (err) {
                console.error(err);
                showToast("Camera denied. Use Upload.", "error");
            }
        }

        // --- Event Listeners ---

        // 1. One-Click Flow Check
        // We define the click handler to hide UI FIRST, then attempt logic.
        document.getElementById('btn-start-experience').addEventListener('click', () => {
            const modal = document.getElementById('start-modal');
            modal.style.display = 'none'; // Brute force hide
            modal.classList.add('hidden'); // Class hide
            startCamera(); 
        });

        document.getElementById('btn-camera').addEventListener('click', startCamera);

        document.getElementById('inp-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                STATE.mode = 'image';
                if (STATE.stream) {
                    STATE.stream.getTracks().forEach(track => track.stop());
                    STATE.stream = null;
                }
                elVideo.style.display = 'none';
                elImg.style.display = 'block';
                elImg.onload = () => {
                    setTimeout(() => {
                        elCanvas.width = elImg.naturalWidth;
                        elCanvas.height = elImg.naturalHeight;
                        drawOverlay(elImg);
                        showToast("Image processed");
                    }, 50);
                };
                elImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        elToggle.addEventListener('change', (e) => {
            STATE.overlayEnabled = e.target.checked;
            if (STATE.mode === 'image') drawOverlay(elImg);
        });

        // 2. Share Logic
        document.getElementById('btn-share').addEventListener('click', async () => {
            const shareData = {
                title: 'ColorSee',
                text: 'Check out ColorSee - Realtime Color Detection!',
                url: window.location.href
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    // Ignore user aborts
                }
            } else {
                // Clipboard fallback
                try {
                    const textArea = document.createElement("textarea");
                    textArea.value = window.location.href;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    showToast("Link copied to clipboard");
                } catch (err) {
                    showToast("Share unavailable", "error");
                }
            }
        });

        window.addEventListener('resize', () => {
           if(STATE.mode === 'image') drawOverlay(elImg);
        });
    </script>
</body>
</html>
